name: Build WASM Engine

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Native espeak-ng-data for WASM Packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng-data

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.41
          actions-cache-folder: 'emsdk-cache'

      - name: Configure CMake for WebAssembly
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: cmake --build build-wasm -j4

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glados-wasm-build
          path: |
            build-wasm/glados_tts.js
            build-wasm/glados_tts.wasm
            build-wasm/glados_tts.data
